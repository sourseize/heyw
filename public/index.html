<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HeyWork — A calm, local-first personal work, focus & journaling OS">
  <title>HeyWork — Focus & Work OS</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🌿</div>
        <span>HeyWork</span>
      </div>

      <div class="nav-group">
        <div class="nav-label">Core</div>
        <a class="nav-item active" data-page="today">
          <span>⏳</span>
          <span>Focus & Today</span>
        </a>
        <a class="nav-item" data-page="board">
          <span>📋</span>
          <span>Task Board</span>
        </a>
      </div>

      <div class="nav-group">
        <div class="nav-label">Reflect</div>
        <a class="nav-item" data-page="journal">
          <span>📖</span>
          <span>Daily Journal</span>
        </a>
        <a class="nav-item" data-page="inbox" data-testid="nav-inbox">
          <span>🧠</span>
          <span>Thought Inbox</span>
          <span class="nav-badge" id="inbox-badge" data-testid="inbox-badge" hidden>0</span>
        </a>
        <a class="nav-item" data-page="notes">
          <span>📝</span>
          <span>Notes & Ideas</span>
        </a>
        <a class="nav-item" data-page="insights">
          <span>📊</span>
          <span>Insights</span>
        </a>
        <a class="nav-item" data-page="bookofwork" data-testid="nav-bookofwork">
          <span>📘</span>
          <span>Book of Work</span>
        </a>
      </div>

      <div class="sidebar-bottom">
        <button class="theme-toggle-btn" id="theme-toggle">
          <span id="theme-label">🌙 Dark Mode</span>
          <span style="font-size:0.75rem;color:var(--text-muted)">Press T</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      <header class="top-bar">
        <div class="top-title">
          <h1 id="page-title">Focus & Today</h1>
        </div>
        <div class="top-actions">
          <span style="font-size:0.8rem;color:var(--text-muted)">Local • Offline • Zero-Cloud</span>
        </div>
      </header>

      <section class="page-content" id="page-content">
        <!-- Rendered dynamically -->
      </section>
    </main>
  </div>

  <!-- Park a thought from anywhere: P opens this, Enter saves, Esc closes -->
  <div id="capture-bar" class="capture-bar" data-testid="capture-bar" hidden>
    <span class="capture-bar-icon">🧠</span>
    <input type="text" id="capture-bar-input" data-testid="capture-bar-input" maxlength="500"
           placeholder="Park a thought… (Enter to save, Esc to close)" autocomplete="off">
    <span class="capture-bar-hint">it goes to your Thought Inbox</span>
  </div>

  <!-- Always-visible countdown for the running block (hidden on the Focus view) -->
  <div id="mini-timer" class="mini-timer" data-testid="mini-timer" hidden></div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/sound.js"></script>
  <script src="/js/timer.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/views/today.js"></script>
  <script src="/js/views/board.js"></script>
  <script src="/js/views/journal.js"></script>
  <script src="/js/views/inbox.js"></script>
  <script src="/js/views/notes.js"></script>
  <script src="/js/views/insights.js"></script>
  <script src="/js/views/bookofwork.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
